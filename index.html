<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tolerance Stack-Up Calculator Prototype 3.1</title>
<style>
body{font-family:Segoe UI,Arial;background:#101722;color:#e6edf7;padding:16px;margin:0}
.card{background:#182230;border:1px solid #2d3a4b;border-radius:10px;padding:12px;margin-bottom:12px}
button,input,select{background:#111a26;color:#fff;border:1px solid #435166;border-radius:4px;padding:4px}
input[type=number]{width:60px}.cp{width:50px}.mean{width:70px}
table{width:100%;border-collapse:collapse}th,td{padding:4px;border-bottom:1px solid #334;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric{background:#121c29;padding:8px;border-radius:8px}
canvas{background:#fff;border-radius:8px;width:100%;height:420px}.bar{height:10px;background:#2563eb;border-radius:5px}.active{background:#2563eb}.banner{margin-top:10px;text-align:center;font-size:36px;font-weight:700;padding:18px;border-radius:10px;color:#fff}.pass{background:#16a34a;border:2px solid #22c55e}.fail{background:#dc2626;border:2px solid #ef4444}
</style>
</head><body>
<h2>Tolerance Stack-Up Calculator</h2>
<div class='card'><button id='wcBtn'>Worst Case</button> <button id='rssBtn' class='active'>RSS</button><div id='passFailBanner' class='banner'>PASS</div><div id='evalMode' style='text-align:center;margin-top:8px;font-weight:600'></div></div>
<div class='card'><table><thead><tr><th>Desc</th><th>Nom</th><th>+Tol</th><th>-Tol</th><th>Dist</th><th>Cp</th><th>Cpk</th><th>Mean</th><th>Dir</th><th></th></tr></thead><tbody id='tb'></tbody></table><br><button id='addBtn'>+ Add Dimension</button> <button id='resetBtn'>Reset Example</button></div>
<div class='card'>Target Nominal <input id='tn' value='60'> +Tol <input id='tp' value='0.3'> -Tol <input id='tm' value='0.3'></div>
<div class='grid'><div class='metric' id='yieldTile'>Expected Yield<div id='yield'></div></div><div class='metric' id='ppmTile'>Expected Defective PPM<div id='ppm'></div></div><div class='metric'>Monte Carlo Mean<div id='amean'></div></div><div class='metric'>Std Dev<div id='sigma'></div></div><div class='metric'>Assy Cpk<div id='acpk'></div></div></div>
<div class='card' style='display:flex;gap:12px;align-items:flex-start'><div style='flex:0 0 260px'><h3>Contributor Ranking</h3><div id='rank'></div></div><div style='flex:1;display:flex;flex-direction:column;gap:8px'><div class='metric' style='border-left:4px solid #4f9cff'>Target Range<div id='targetRange'></div></div><div class='metric' style='border-left:4px solid #9b59b6'>WC Range<div id='wcRange'></div></div><div class='metric' style='border-left:4px solid #f39c12'>RSS Range<div id='rssRange'></div></div></div></div>
<div class='card'><canvas id='cv' width='1200' height='420'></canvas></div>
<script>
let mode='rss';const tb=document.getElementById('tb');const cv=document.getElementById('cv');const ctx=cv.getContext('2d');
function normalizeNumberInput(input){let v=input.value.trim();if(v==='')return;if(v.startsWith('-.'))v='-0'+v.slice(1);else if(v.startsWith('.'))v='0'+v;else if(v.startsWith('+.'))v='0'+v.slice(1);input.value=v;}
function addRow(d){let tr=document.createElement('tr');tr.innerHTML=`<td><input class=d value='${d.desc}'></td><td><input class=n type=number value='${d.nom}'></td><td><input class=p type=number value='${d.plus}'></td><td><input class=m type=number value='${d.minus}'></td><td><select class=dist><option>normal</option><option>uniform</option><option>triangular</option></select></td><td><input class=cp value='${d.cp}'></td><td class=cpkv>--</td><td><input class=mean value='${d.mean}'></td><td><select class=dir><option value='1'>+</option><option value='-1'>-</option></select></td><td><button class=del>X</button></td>`;tb.appendChild(tr);tr.querySelector('.dist').value=d.dist;tr.querySelector('.dir').value=d.dir;tr.querySelector('.del').onclick=()=>{tr.remove();calc()};tr.querySelectorAll('input').forEach(e=>{e.addEventListener('blur',()=>{normalizeNumberInput(e);calc();});e.addEventListener('input',calc);});tr.querySelectorAll('select').forEach(e=>e.oninput=calc)}
function rows(){return [...tb.rows].map(r=>({desc:r.querySelector('.d').value,nom:+r.querySelector('.n').value,plus:+r.querySelector('.p').value,minus:+r.querySelector('.m').value,dist:r.querySelector('.dist').value,cp:+r.querySelector('.cp').value||1,mean:+r.querySelector('.mean').value,dir:+r.querySelector('.dir').value,row:r}))}
function sig(r){let w=r.plus+r.minus;if(r.dist==='uniform')return w/Math.sqrt(12);if(r.dist==='triangular')return w/Math.sqrt(24);return w/(6*Math.max(.1,r.cp));}
function rn(mu,s){let u=Math.random(),v=Math.random();return mu+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function sample(r){return rn(r.mean,sig(r));}
function calc(){let rs=rows(),v2=0,nom=0;rs.forEach(r=>{v2+=sig(r)**2;nom+=r.dir*r.nom;let s=sig(r);let usl=r.nom+r.plus;let lsl=r.nom-r.minus;let cpk='--';if(s>0){cpk=Math.min((usl-r.mean)/(3*s),(r.mean-lsl)/(3*s));cpk=cpk.toFixed(2);}if(r.row&&r.row.querySelector('.cpkv')){let c=r.row.querySelector('.cpkv');c.textContent=cpk;if(cpk!=='--'){let v=parseFloat(cpk);c.style.fontWeight='700';c.style.color=v>=1.33?'#22c55e':(v>=1?'#facc15':'#ef4444');}}});let rss3=3*Math.sqrt(v2),rssMin=nom-rss3,rssMax=nom+rss3;let wcMin=nom-rs.reduce((a,r)=>a+r.minus,0),wcMax=nom+rs.reduce((a,r)=>a+r.plus,0);
let tn=+tnEl.value,tp=+tpEl.value,tm=+tmEl.value,tmin=tn-tm,tmax=tn+tp;
 let data=[];for(let i=0;i<4000;i++){let s=0;rs.forEach(r=>s+=r.dir*sample(r));data.push(s)}
 let mean=data.reduce((a,b)=>a+b,0)/data.length; let sd=Math.sqrt(data.reduce((a,b)=>a+(b-mean)**2,0)/(data.length-1)); let analyticalMean=0; let analyticalVar=0; rs.forEach(r=>{analyticalMean+=r.dir*r.mean; analyticalVar+=Math.pow(sig(r),2);}); let analyticalSigma=Math.sqrt(analyticalVar);
 function erf(x){const s=x>=0?1:-1;x=Math.abs(x);const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;const t=1/(1+p*x);const y=1-(((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t)*Math.exp(-x*x);return s*y;}function cdf(x){return 0.5*(1+erf(x/Math.sqrt(2)));}let yieldPct=100;let defectivePPM=0;if(analyticalSigma>0){let pLow=cdf((tmin-analyticalMean)/analyticalSigma);let pHigh=1-cdf((tmax-analyticalMean)/analyticalSigma);let failRate=pLow+pHigh;yieldPct=(1-failRate)*100;defectivePPM=failRate*1000000;}document.getElementById('amean').innerText=analyticalMean.toFixed(3);document.getElementById('sigma').innerText=analyticalSigma.toFixed(4);document.getElementById('yield').innerText=yieldPct.toFixed(4)+'%';document.getElementById('ppm').innerText=Math.round(defectivePPM).toLocaleString();let cpk='--';if(analyticalSigma>0){cpk=Math.min((tmax-analyticalMean)/(3*analyticalSigma),(analyticalMean-tmin)/(3*analyticalSigma)).toFixed(2);}document.getElementById('acpk').innerText=cpk;
 document.getElementById('rssRange').innerText=rssMin.toFixed(3)+' → '+rssMax.toFixed(3);document.getElementById('wcRange').innerText=wcMin.toFixed(3)+' → '+wcMax.toFixed(3);document.getElementById('targetRange').innerText=tmin.toFixed(3)+' → '+tmax.toFixed(3);let pass=(mode==='rss')?(rssMin>=tmin&&rssMax<=tmax):(wcMin>=tmin&&wcMax<=tmax);const banner=document.getElementById('passFailBanner');banner.innerText=pass?'PASS':'FAIL';banner.className=pass?'banner pass':'banner fail';document.getElementById('evalMode').innerText=mode==='rss'?'Evaluating RSS Range':'Evaluating Worst Case Range';const y=document.getElementById('yieldTile');const p=document.getElementById('ppmTile');if(y&&p){if(mode==='worst'){y.style.opacity='0.5';p.style.opacity='0.5';}else{y.style.opacity='1';p.style.opacity='1';}}
 rank.innerHTML='';rs.map(r=>({name:r.desc,contribution:100*(sig(r)**2)/(v2||1)})).sort((a,b)=>b.contribution-a.contribution).forEach((r,i)=>{rank.innerHTML+=`<div style="margin-bottom:10px"><div><b>#${i+1}</b> ${r.name} ${r.contribution.toFixed(1)}%</div><div class="bar" style="width:${Math.max(3,r.contribution)}%;background:${i===0?'#ffcc00':'#2563eb'}"></div></div>`;});draw(data,{tmin,tmax,tn,rssMin,rssMax,wcMin,wcMax,mean});
}
function draw(data,m){window.bottomLabels=[];ctx.clearRect(0,0,cv.width,cv.height);const top=140,bottom=360,left=70,right=cv.width-50;let mn=Math.min(...data,m.tmin,m.wcMin),mx=Math.max(...data,m.tmax,m.wcMax);let pad=(mx-mn)*0.15||1;mn-=pad;mx+=pad;const map=v=>left+(v-mn)/(mx-mn)*(right-left);
 ctx.strokeStyle='#ddd';for(let i=0;i<=10;i++){let x=left+(right-left)*i/10;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();}
 if(mode==='rss'){const bins=40,h=Array(bins).fill(0);data.forEach(v=>{let i=Math.max(0,Math.min(bins-1,Math.floor((v-mn)/(mx-mn)*bins)));h[i]++});let mh=Math.max(...h);for(let i=0;i<bins;i++){let bw=(right-left)/bins,bh=h[i]/mh*180;ctx.fillStyle='#6ba8ff';ctx.fillRect(left+i*bw,bottom-bh,bw-1,bh);}}else{ctx.fillStyle='rgba(155,89,182,0.40)';ctx.fillRect(map(m.wcMin),220,map(m.wcMax)-map(m.wcMin),60);ctx.strokeStyle='#9b59b6';ctx.strokeRect(map(m.wcMin),220,map(m.wcMax)-map(m.wcMin),60);} 
 const used=[];
 function marker(v,color,label){let x=map(v),lane=0;while(used.some(p=>Math.abs(p.x-x)<70&&p.lane===lane))lane++;used.push({x,lane});let y=20+lane*18;let side=lane%2;let lx=side?x-140:x+18;let ey=y-6;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,ey);ctx.lineTo(side?lx+120:lx-5,ey);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,ey,3,0,6.28);ctx.fill();if(label==='WC Min'||label==='WC Max'||label==='MC Mean'){lx=x+6;}ctx.fillText(label,lx,y);if(!window.bottomLabels)window.bottomLabels=[];let by=bottom+22;while(window.bottomLabels.some(p=>Math.abs(p.x-x)<55 && p.y===by)){by+=14;}window.bottomLabels.push({x:x,y:by});ctx.fillStyle=color;ctx.fillText(v.toFixed(3),x-18,by);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();}
 marker(m.tmin,'#4f9cff','T Min');marker(m.tn,'#4f9cff','Target');marker(m.tmax,'#4f9cff','T Max');marker(m.rssMin,'#f39c12','RSS Min');marker(m.rssMax,'#f39c12','RSS Max');marker(m.wcMin,'#9b59b6','WC Min');marker(m.wcMax,'#9b59b6','WC Max');marker(m.mean,'#2ecc71','MC Mean');ctx.fillStyle='rgba(255,255,255,0.9)';const legY=(cv.height-90)/2;ctx.fillRect(cv.width-180,legY,160,90);ctx.strokeRect(cv.width-180,legY,160,90);[['#4f9cff','Target'],['#f39c12','RSS'],['#9b59b6','Worst Case'],['#2ecc71','MC Mean']].forEach((l,i)=>{ctx.fillStyle=l[0];ctx.fillRect(cv.width-170,legY+15+i*18,12,12);ctx.fillStyle='#000';ctx.fillText(l[1],cv.width-150,legY+25+i*18);});
 }
 const tnEl=document.getElementById('tn'),tpEl=document.getElementById('tp'),tmEl=document.getElementById('tm');
['tn','tp','tm'].forEach(id=>{const el=document.getElementById(id);if(el){el.addEventListener('blur',()=>{normalizeNumberInput(el);calc();});}});
 document.getElementById('addBtn').onclick=()=>{addRow({desc:'New',nom:10,plus:.1,minus:.1,dist:'normal',cp:1,mean:10,dir:1});calc()};
 document.getElementById('resetBtn').onclick=seed;
 
const wcBtn=document.getElementById('wcBtn');
const rssBtn=document.getElementById('rssBtn');
wcBtn.onclick=()=>{mode='worst';wcBtn.classList.add('active');rssBtn.classList.remove('active');calc();};
rssBtn.onclick=()=>{mode='rss';rssBtn.classList.add('active');wcBtn.classList.remove('active');calc();};

function seed(){tb.innerHTML='';addRow({desc:'A',nom:50,plus:.2,minus:.2,dist:'normal',cp:1,mean:50,dir:1});addRow({desc:'B',nom:20,plus:.1,minus:.1,dist:'normal',cp:1,mean:20,dir:1});addRow({desc:'C',nom:10,plus:.05,minus:.05,dist:'normal',cp:1,mean:10,dir:-1});calc();}
 seed();
</script></body></html>
